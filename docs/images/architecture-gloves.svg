<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="560" viewBox="0 0 930 280" font-family="DejaVu Sans, Arial, sans-serif">
  <title>sign_talk gloves: signs to text and voice</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .ct { fill: none; stroke: #B4B2A9; stroke-width: 0.8; stroke-dasharray: 4 4; }
      .cl { font-size: 12px; fill: #5F5E5A; }
      .lg { font-size: 11px; fill: #5F5E5A; dominant-baseline: central; }
      .ex { font-size: 11px; fill: #2C2C2A; dominant-baseline: central; }
      .t { font-size: 13px; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
      .s { font-size: 11px; text-anchor: middle; dominant-baseline: central; }
      .gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.8; } .gray .t { fill: #2C2C2A; } .gray .s { fill: #5F5E5A; }
      .done rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.8; } .done .t { fill: #085041; } .done .s { fill: #0F6E56; }
      .next rect { fill: #FAEEDA; stroke: #854F0B; stroke-width: 0.8; } .next .t { fill: #633806; } .next .s { fill: #854F0B; }
      .a { stroke: #5F5E5A; stroke-width: 1.2; fill: none; }
    </style>
  </defs>
  <rect width="930" height="280" fill="#FFFFFF"/>

  <rect class="ct" x="20" y="20" width="140" height="190" rx="12"/>
  <text class="cl" x="32" y="40">Wearer (signs)</text>
  <rect class="ct" x="175" y="20" width="550" height="190" rx="12"/>
  <text class="cl" x="187" y="40">Laptop</text>
  <rect class="ct" x="740" y="20" width="170" height="190" rx="12"/>
  <text class="cl" x="752" y="40">Hearing person</text>

  <g class="gray"><rect x="30" y="55" width="120" height="50" rx="8"/><text class="t" x="90" y="71">Rokoko gloves</text><text class="s" x="90" y="90">Makes a sign</text></g>

  <g class="gray"><rect x="188" y="55" width="120" height="50" rx="8"/><text class="t" x="248" y="71">Rokoko Studio</text><text class="s" x="248" y="90">Windows or Mac</text></g>
  <g class="done"><rect x="322" y="55" width="120" height="50" rx="8"/><text class="t" x="382" y="71">Stream reader</text><text class="s" x="382" y="90">Finger angles</text></g>
  <g class="done"><rect x="456" y="55" width="120" height="50" rx="8"/><text class="t" x="516" y="71">Recogniser</text><text class="s" x="516" y="90">Closest match</text></g>
  <g class="next"><rect x="456" y="140" width="120" height="50" rx="8"/><text class="t" x="516" y="156">Recordings</text><text class="s" x="516" y="175">~10 signs × 10–15</text></g>
  <g class="next"><rect x="586" y="55" width="134" height="50" rx="8"/><text class="t" x="653" y="71">Sentence maker</text><text class="s" x="653" y="90">Gemini: grammar</text></g>

  <g class="next"><rect x="752" y="55" width="146" height="50" rx="8"/><text class="t" x="825" y="71">Text on screen</text><text class="s" x="825" y="90">Finnish + English</text></g>
  <g class="next"><rect x="752" y="140" width="146" height="50" rx="8"/><text class="t" x="825" y="156">Voice</text><text class="s" x="825" y="175">Laptop or ElevenLabs</text></g>

  <line class="a" x1="150" y1="80" x2="185" y2="80" marker-end="url(#arrow)"/>
  <line class="a" x1="308" y1="80" x2="319" y2="80" marker-end="url(#arrow)"/>
  <line class="a" x1="442" y1="80" x2="453" y2="80" marker-end="url(#arrow)"/>
  <line class="a" x1="516" y1="140" x2="516" y2="108" marker-end="url(#arrow)"/>
  <line class="a" x1="576" y1="80" x2="583" y2="80" marker-end="url(#arrow)"/>
  <line class="a" x1="720" y1="80" x2="749" y2="80" marker-end="url(#arrow)"/>
  <path class="a" d="M732 80 L732 165 L749 165" marker-end="url(#arrow)"/>

  <text class="lg" x="188" y="135">Studio sends hand data to our scripts.</text>
  <text class="lg" x="188" y="153">Letters in a row become one name.</text>
  <text class="lg" x="188" y="171">A rest pose ends the sentence.</text>
  <text class="lg" x="586" y="135">Adds "is" and endings,</text>
  <text class="lg" x="586" y="153">no training needed.</text>

  <text class="ex" x="20" y="232">Example: ME + NAME + E-L-I-N-A  →  "Minun nimeni on Elina."  /  "My name is Elina."</text>

  <g class="gray"><rect x="20" y="254" width="14" height="14" rx="3"/></g><text class="lg" x="40" y="261">Rokoko's</text>
  <g class="done"><rect x="110" y="254" width="14" height="14" rx="3"/></g><text class="lg" x="130" y="261">Built, not yet tried on real gloves</text>
  <g class="next"><rect x="345" y="254" width="14" height="14" rx="3"/></g><text class="lg" x="365" y="261">To build or record</text>
</svg>
