<svg xmlns="http://www.w3.org/2000/svg" width="2280" height="880" viewBox="0 0 1140 440" font-family="DejaVu Sans, Arial, sans-serif">
  <title>sign_talk version 3: FinSL signs from speech</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .ct { fill: none; stroke: #B4B2A9; stroke-width: 0.8; stroke-dasharray: 4 4; }
      .cl { font-size: 12px; fill: #5F5E5A; }
      .lg { font-size: 11px; fill: #5F5E5A; dominant-baseline: central; }
      .t { font-size: 13px; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
      .s { font-size: 11px; text-anchor: middle; dominant-baseline: central; }
      .gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.8; } .gray .t { fill: #2C2C2A; } .gray .s { fill: #5F5E5A; }
      .purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.8; } .purple .t { fill: #3C3489; } .purple .s { fill: #534AB7; }
      .blue rect { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.8; } .blue .t { fill: #0C447C; } .blue .s { fill: #185FA5; }
      .a { stroke: #5F5E5A; stroke-width: 1.2; fill: none; }
    </style>
  </defs>
  <rect width="1140" height="440" fill="#FFFFFF"/>

  <!-- Row 1: live path -->
  <rect class="ct" x="20" y="20" width="150" height="110" rx="12"/>
  <text class="cl" x="32" y="40">Glasses</text>
  <rect class="ct" x="185" y="20" width="150" height="110" rx="12"/>
  <text class="cl" x="197" y="40">Phone: our app</text>
  <rect class="ct" x="350" y="20" width="440" height="110" rx="12"/>
  <text class="cl" x="362" y="40">Laptop backend</text>
  <rect class="ct" x="805" y="20" width="150" height="110" rx="12"/>
  <text class="cl" x="817" y="40">Phone: our app</text>
  <rect class="ct" x="970" y="20" width="150" height="110" rx="12"/>
  <text class="cl" x="982" y="40">Glasses</text>

  <g class="gray"><rect x="30" y="60" width="130" height="50" rx="8"/><text class="t" x="95" y="76">Glasses mic</text><text class="s" x="95" y="95">Phone mic for now</text></g>
  <g class="gray"><rect x="195" y="60" width="130" height="50" rx="8"/><text class="t" x="260" y="76">Speech to text</text><text class="s" x="260" y="95">Finnish or English</text></g>
  <g class="purple"><rect x="360" y="60" width="130" height="50" rx="8"/><text class="t" x="425" y="76">Sign finder</text><text class="s" x="425" y="95">Words → sign names</text></g>
  <g class="purple"><rect x="505" y="60" width="130" height="50" rx="8"/><text class="t" x="570" y="76">Signbank check</text><text class="s" x="570" y="95">Unknown → letters</text></g>
  <g class="purple"><rect x="650" y="60" width="130" height="50" rx="8"/><text class="t" x="715" y="76">Video maker</text><text class="s" x="715" y="95">Joins sign clips</text></g>
  <g class="purple"><rect x="815" y="60" width="130" height="50" rx="8"/><text class="t" x="880" y="76">Lens renderer</text><text class="s" x="880" y="95">Caption, then signs</text></g>
  <g class="gray"><rect x="980" y="60" width="130" height="50" rx="8"/><text class="t" x="1045" y="76">Lens display</text><text class="s" x="1045" y="95">Mock, in Chrome</text></g>

  <line class="a" x1="160" y1="85" x2="193" y2="85" marker-end="url(#arrow)"/>
  <line class="a" x1="325" y1="85" x2="358" y2="85" marker-end="url(#arrow)"/>
  <line class="a" x1="490" y1="85" x2="503" y2="85" marker-end="url(#arrow)"/>
  <line class="a" x1="635" y1="85" x2="648" y2="85" marker-end="url(#arrow)"/>
  <line class="a" x1="780" y1="85" x2="813" y2="85" marker-end="url(#arrow)"/>
  <line class="a" x1="945" y1="85" x2="978" y2="85" marker-end="url(#arrow)"/>

  <!-- Row 2: services used live -->
  <rect class="ct" x="350" y="150" width="150" height="100" rx="12"/>
  <text class="cl" x="362" y="168">Verda</text>
  <rect class="ct" x="515" y="150" width="275" height="100" rx="12"/>
  <text class="cl" x="527" y="168">Online</text>

  <g class="purple"><rect x="360" y="185" width="130" height="50" rx="8"/><text class="t" x="425" y="201">Gemma</text><text class="s" x="425" y="220">Fine-tuned by us</text></g>
  <g class="gray"><rect x="587" y="185" width="130" height="50" rx="8"/><text class="t" x="652" y="201">Signbank</text><text class="s" x="652" y="220">FinSL sign videos</text></g>

  <line class="a" x1="425" y1="113" x2="425" y2="182" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line class="a" x1="620" y1="183" x2="585" y2="113" marker-end="url(#arrow)"/>
  <line class="a" x1="685" y1="183" x2="705" y2="113" marker-end="url(#arrow)"/>

  <!-- Row 3: built once, before the demo -->
  <rect class="ct" x="20" y="275" width="650" height="105" rx="12"/>
  <text class="cl" x="32" y="293">Built once, before the demo</text>

  <g class="blue"><rect x="30" y="310" width="130" height="50" rx="8"/><text class="t" x="95" y="326">FinSL corpus</text><text class="s" x="95" y="345">~5k signed sentences</text></g>
  <g class="blue"><rect x="195" y="310" width="130" height="50" rx="8"/><text class="t" x="260" y="326">Data prep</text><text class="s" x="260" y="345">Clean, add English</text></g>
  <g class="blue"><rect x="360" y="310" width="130" height="50" rx="8"/><text class="t" x="425" y="326">Fine-tuning</text><text class="s" x="425" y="345">LoRA on Verda GPU</text></g>
  <g class="blue"><rect x="525" y="310" width="130" height="50" rx="8"/><text class="t" x="590" y="326">Evaluation</text><text class="s" x="590" y="345">vs. no training</text></g>

  <line class="a" x1="160" y1="335" x2="193" y2="335" marker-end="url(#arrow)"/>
  <line class="a" x1="325" y1="335" x2="358" y2="335" marker-end="url(#arrow)"/>
  <line class="a" x1="490" y1="335" x2="523" y2="335" marker-end="url(#arrow)"/>
  <line class="a" x1="425" y1="308" x2="425" y2="238" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="700" y="290" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text class="lg" x="722" y="297">From earlier versions, or not ours</text>
  <rect x="700" y="318" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text class="lg" x="722" y="325">New: runs live, every sentence</text>
  <rect x="700" y="346" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text class="lg" x="722" y="353">New: done once, before the demo</text>

  <text class="lg" x="20" y="415">Example: "Juna Helsinkiin lähtee laiturilta neljä" → JUNA-ASEMA  HELSINKI  LAITURI  NELJÄ → one short sign video, then the caption again.</text>
</svg>
