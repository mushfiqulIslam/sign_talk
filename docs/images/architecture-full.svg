<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="760" viewBox="0 0 680 380" font-family="DejaVu Sans, Arial, sans-serif">
  <title>sign_talk full system architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .ct { fill: none; stroke: #B4B2A9; stroke-width: 0.8; stroke-dasharray: 4 4; }
      .cl { font-size: 12px; fill: #5F5E5A; }
      .t { font-size: 13px; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
      .s { font-size: 11px; text-anchor: middle; dominant-baseline: central; }
      .gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.8; } .gray .t { fill: #2C2C2A; } .gray .s { fill: #5F5E5A; }
      .purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.8; } .purple .t { fill: #3C3489; } .purple .s { fill: #534AB7; }
      .teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.8; } .teal .t { fill: #085041; } .teal .s { fill: #0F6E56; }
      .a { stroke: #5F5E5A; stroke-width: 1.2; fill: none; }
    </style>
  </defs>
  <rect width="680" height="380" fill="#FFFFFF"/>

  <rect class="ct" x="20" y="20" width="150" height="320" rx="12"/>
  <text class="cl" x="30" y="40">Glasses</text>
  <rect class="ct" x="185" y="20" width="150" height="320" rx="12"/>
  <text class="cl" x="195" y="40">Android app</text>
  <rect class="ct" x="350" y="20" width="170" height="320" rx="12"/>
  <text class="cl" x="360" y="40">Laptop backend</text>
  <rect class="ct" x="535" y="20" width="125" height="320" rx="12"/>
  <text class="cl" x="545" y="40">Cloud</text>

  <g class="gray"><rect x="30" y="60" width="130" height="50" rx="8"/><text class="t" x="95" y="76">Microphone</text><text class="s" x="95" y="95">Speech, sounds</text></g>
  <g class="gray"><rect x="30" y="270" width="130" height="50" rx="8"/><text class="t" x="95" y="286">Lens display</text><text class="s" x="95" y="305">600 × 600 screen</text></g>

  <g class="purple"><rect x="195" y="60" width="130" height="50" rx="8"/><text class="t" x="260" y="76">Speech listener</text><text class="s" x="260" y="95">Meta speech</text></g>
  <g class="purple"><rect x="195" y="130" width="130" height="50" rx="8"/><text class="t" x="260" y="146">Trip settings</text><text class="s" x="260" y="165">Typed in the app</text></g>
  <g class="purple"><rect x="195" y="200" width="130" height="50" rx="8"/><text class="t" x="260" y="216">Audio capture</text><text class="s" x="260" y="235">Sound chunks</text></g>
  <g class="purple"><rect x="195" y="270" width="130" height="50" rx="8"/><text class="t" x="260" y="286">Lens renderer</text><text class="s" x="260" y="305">Meta display</text></g>

  <g class="teal"><rect x="360" y="60" width="130" height="50" rx="8"/><text class="t" x="425" y="76">Caption relay</text><text class="s" x="425" y="95">Text straight on</text></g>
  <g class="teal"><rect x="360" y="130" width="130" height="50" rx="8"/><text class="t" x="425" y="146">Announcements</text><text class="s" x="425" y="165">Is it my trip?</text></g>
  <g class="teal"><rect x="360" y="200" width="130" height="50" rx="8"/><text class="t" x="425" y="216">Sound alerts</text><text class="s" x="425" y="235">YAMNet, local</text></g>
  <g class="teal"><rect x="360" y="270" width="130" height="50" rx="8"/><text class="t" x="425" y="286">Message hub</text><text class="s" x="425" y="305">FastAPI sockets</text></g>

  <g class="gray"><rect x="545" y="130" width="105" height="50" rx="8"/><text class="t" x="597" y="146">Gemini API</text><text class="s" x="597" y="165">Google cloud</text></g>

  <line class="a" x1="160" y1="85" x2="192" y2="85" marker-end="url(#arrow)"/>
  <path class="a" d="M95 110 L95 225 L192 225" marker-end="url(#arrow)"/>
  <line class="a" x1="325" y1="85" x2="357" y2="85" marker-end="url(#arrow)"/>
  <line class="a" x1="325" y1="155" x2="357" y2="155" marker-end="url(#arrow)"/>
  <line class="a" x1="325" y1="225" x2="357" y2="225" marker-end="url(#arrow)"/>
  <line class="a" x1="493" y1="148" x2="542" y2="148" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="a" d="M490 85 L505 85 L505 295 L493 295" marker-end="url(#arrow)"/>
  <path class="a" d="M490 168 L505 168"/>
  <path class="a" d="M490 225 L505 225"/>
  <line class="a" x1="360" y1="295" x2="328" y2="295" marker-end="url(#arrow)"/>
  <line class="a" x1="195" y1="295" x2="163" y2="295" marker-end="url(#arrow)"/>

  <text class="cl" x="20" y="366">Only text goes to the cloud. Audio is never stored.</text>
</svg>
