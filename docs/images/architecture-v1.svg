<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="500" viewBox="0 0 790 250" font-family="DejaVu Sans, Arial, sans-serif">
  <title>sign_talk now and next: listen and show</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .ct { fill: none; stroke: #B4B2A9; stroke-width: 0.8; stroke-dasharray: 4 4; }
      .cl { font-size: 12px; fill: #5F5E5A; }
      .lg { font-size: 11px; fill: #5F5E5A; dominant-baseline: central; }
      .t { font-size: 13px; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
      .s { font-size: 11px; text-anchor: middle; dominant-baseline: central; }
      .done rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.8; } .done .t { fill: #085041; } .done .s { fill: #0F6E56; }
      .next rect { fill: #FAEEDA; stroke: #854F0B; stroke-width: 0.8; } .next .t { fill: #633806; } .next .s { fill: #854F0B; }
      .a { stroke: #5F5E5A; stroke-width: 1.2; fill: none; }
    </style>
  </defs>
  <rect width="790" height="250" fill="#FFFFFF"/>

  <rect class="ct" x="20" y="20" width="150" height="175" rx="12"/>
  <text class="cl" x="32" y="40">Glasses</text>
  <rect class="ct" x="185" y="20" width="425" height="175" rx="12"/>
  <text class="cl" x="197" y="40">Phone: our Android app</text>
  <rect class="ct" x="625" y="20" width="145" height="175" rx="12"/>
  <text class="cl" x="637" y="40">Glasses</text>

  <g class="done"><rect x="198" y="55" width="120" height="50" rx="8"/><text class="t" x="258" y="71">Phone mic</text><text class="s" x="258" y="90">Backup source</text></g>
  <g class="done"><rect x="332" y="55" width="120" height="50" rx="8"/><text class="t" x="392" y="71">Speech to text</text><text class="s" x="392" y="90">Android, on phone</text></g>

  <g class="next"><rect x="35" y="130" width="120" height="50" rx="8"/><text class="t" x="95" y="146">Glasses mic</text><text class="s" x="95" y="165">Mock: phone mic</text></g>
  <g class="next"><rect x="332" y="130" width="120" height="50" rx="8"/><text class="t" x="392" y="146">Speech to text</text><text class="s" x="392" y="165">Meta, on glasses</text></g>

  <g class="done"><rect x="478" y="92" width="120" height="50" rx="8"/><text class="t" x="538" y="108">Lens renderer</text><text class="s" x="538" y="127">Meta display</text></g>
  <g class="done"><rect x="637" y="92" width="120" height="50" rx="8"/><text class="t" x="697" y="108">Lens display</text><text class="s" x="697" y="127">Mock, in Chrome</text></g>

  <line class="a" x1="318" y1="80" x2="329" y2="80" marker-end="url(#arrow)"/>
  <line class="a" x1="155" y1="155" x2="329" y2="155" marker-end="url(#arrow)"/>
  <path class="a" d="M452 80 L465 80 L465 108 L475 108" marker-end="url(#arrow)"/>
  <path class="a" d="M452 155 L465 155 L465 126 L475 126" marker-end="url(#arrow)"/>
  <line class="a" x1="598" y1="117" x2="634" y2="117" marker-end="url(#arrow)"/>

  <g class="done"><rect x="20" y="214" width="14" height="14" rx="3"/></g><text class="lg" x="40" y="221">Done and working</text>
  <g class="next"><rect x="160" y="214" width="14" height="14" rx="3"/></g><text class="lg" x="180" y="221">Next: building now</text>
  <text class="lg" x="330" y="221">A switch in the app picks the glasses mic or the phone mic.</text>
</svg>
