<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="300" viewBox="0 0 680 150" font-family="DejaVu Sans, Arial, sans-serif">
  <title>sign_talk version 1: listen and show</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .ct { fill: none; stroke: #B4B2A9; stroke-width: 0.8; stroke-dasharray: 4 4; }
      .cl { font-size: 12px; fill: #5F5E5A; }
      .t { font-size: 13px; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
      .s { font-size: 11px; text-anchor: middle; dominant-baseline: central; }
      .gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.8; } .gray .t { fill: #2C2C2A; } .gray .s { fill: #5F5E5A; }
      .purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.8; } .purple .t { fill: #3C3489; } .purple .s { fill: #534AB7; }
      .a { stroke: #5F5E5A; stroke-width: 1.2; fill: none; }
    </style>
  </defs>
  <rect width="680" height="150" fill="#FFFFFF"/>

  <rect class="ct" x="30" y="20" width="460" height="110" rx="12"/>
  <text class="cl" x="44" y="40">Phone: our Android app</text>
  <rect class="ct" x="510" y="20" width="150" height="110" rx="12"/>
  <text class="cl" x="524" y="40">Glasses</text>

  <g class="purple"><rect x="45" y="58" width="130" height="56" rx="8"/><text class="t" x="110" y="76">Microphone</text><text class="s" x="110" y="96">Phone, for now</text></g>
  <g class="purple"><rect x="195" y="58" width="130" height="56" rx="8"/><text class="t" x="260" y="76">Speech to text</text><text class="s" x="260" y="96">Android speech</text></g>
  <g class="purple"><rect x="345" y="58" width="130" height="56" rx="8"/><text class="t" x="410" y="76">Lens renderer</text><text class="s" x="410" y="96">Meta display</text></g>
  <g class="gray"><rect x="520" y="58" width="130" height="56" rx="8"/><text class="t" x="585" y="76">Lens display</text><text class="s" x="585" y="96">Mock, for now</text></g>

  <line class="a" x1="175" y1="86" x2="192" y2="86" marker-end="url(#arrow)"/>
  <line class="a" x1="325" y1="86" x2="342" y2="86" marker-end="url(#arrow)"/>
  <line class="a" x1="475" y1="86" x2="517" y2="86" marker-end="url(#arrow)"/>
</svg>
