<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="570" viewBox="0 0 790 285" font-family="DejaVu Sans, Arial, sans-serif">
  <title>sign_talk version 2: sign clips</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .ct { fill: none; stroke: #B4B2A9; stroke-width: 0.8; stroke-dasharray: 4 4; }
      .cl { font-size: 12px; fill: #5F5E5A; }
      .lg { font-size: 11px; fill: #5F5E5A; dominant-baseline: central; }
      .t { font-size: 13px; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
      .s { font-size: 11px; text-anchor: middle; dominant-baseline: central; }
      .gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.8; } .gray .t { fill: #2C2C2A; } .gray .s { fill: #5F5E5A; }
      .purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.8; } .purple .t { fill: #3C3489; } .purple .s { fill: #534AB7; }
      .a { stroke: #5F5E5A; stroke-width: 1.2; fill: none; }
    </style>
  </defs>
  <rect width="790" height="285" fill="#FFFFFF"/>

  <rect class="ct" x="20" y="20" width="150" height="115" rx="12"/>
  <text class="cl" x="32" y="40">Glasses</text>
  <rect class="ct" x="185" y="20" width="425" height="115" rx="12"/>
  <text class="cl" x="197" y="40">Phone: our Android app</text>
  <rect class="ct" x="625" y="20" width="145" height="115" rx="12"/>
  <text class="cl" x="637" y="40">Glasses</text>
  <rect class="ct" x="625" y="150" width="145" height="95" rx="12"/>
  <text class="cl" x="637" y="168">Online</text>

  <g class="gray"><rect x="35" y="55" width="120" height="50" rx="8"/><text class="t" x="95" y="71">Glasses mic</text><text class="s" x="95" y="90">Phone mic backup</text></g>
  <g class="gray"><rect x="198" y="55" width="120" height="50" rx="8"/><text class="t" x="258" y="71">Speech to text</text><text class="s" x="258" y="90">From version 1</text></g>
  <g class="purple"><rect x="332" y="55" width="120" height="50" rx="8"/><text class="t" x="392" y="71">Clip matcher</text><text class="s" x="392" y="90">Trigger phrases</text></g>
  <g class="purple"><rect x="478" y="55" width="120" height="50" rx="8"/><text class="t" x="538" y="71">Lens renderer</text><text class="s" x="538" y="90">Clip, or text</text></g>
  <g class="gray"><rect x="637" y="55" width="120" height="50" rx="8"/><text class="t" x="697" y="71">Lens display</text><text class="s" x="697" y="90">Mock, in Chrome</text></g>
  <g class="purple"><rect x="637" y="180" width="120" height="50" rx="8"/><text class="t" x="697" y="196">Sign clips</text><text class="s" x="697" y="215">5–10 MP4s, https</text></g>

  <line class="a" x1="155" y1="80" x2="195" y2="80" marker-end="url(#arrow)"/>
  <line class="a" x1="318" y1="80" x2="329" y2="80" marker-end="url(#arrow)"/>
  <line class="a" x1="452" y1="80" x2="475" y2="80" marker-end="url(#arrow)"/>
  <line class="a" x1="598" y1="80" x2="634" y2="80" marker-end="url(#arrow)"/>
  <line class="a" x1="697" y1="180" x2="697" y2="108" marker-end="url(#arrow)"/>

  <text class="lg" x="198" y="160">Heard a trigger phrase: the lens plays that sign clip.</text>
  <text class="lg" x="198" y="178">Nothing matched: the lens shows the caption text.</text>
  <text class="lg" x="198" y="196">The glasses fetch the clip from its web address.</text>

  <g class="gray"><rect x="20" y="256" width="14" height="14" rx="3"/></g><text class="lg" x="40" y="263">From version 1</text>
  <g class="purple"><rect x="150" y="256" width="14" height="14" rx="3"/></g><text class="lg" x="170" y="263">New in version 2</text>
</svg>
